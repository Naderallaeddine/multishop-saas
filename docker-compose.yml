version: '3.9'

services:


  redis:
    image: redis:7-alpine
    container_name: multishop_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - multishop_network

volumes:
  sqlserver_data:
  redis_data:

networks:
  multishop_network:
    driver: bridge