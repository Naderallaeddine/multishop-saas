version: '3.9'

services:

  redis:
    image: redis:7-alpine
    container_name: multishop_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - multishop_network

  frontend:
    build:
      context: ./multishop-frontend
      dockerfile: Dockerfile
    container_name: multishop_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./multishop-frontend:/app
      - /app/node_modules
    networks:
      - multishop_network

volumes:
  redis_data:

networks:
  multishop_network:
    driver: bridge